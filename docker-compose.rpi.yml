version: '3.8'

services:
  # PostgreSQL Database (lightweight Alpine image for RPi)
  postgres:
    image: postgres:16-alpine
    container_name: priceghost-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-in-production}
      POSTGRES_DB: priceghost
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # RPi optimization: Limit memory usage
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backend API (ARM-compatible build)
  backend:
    image: priceghost-backend:rpi-arm64
    build:
      context: ./backend
      dockerfile: Dockerfile.rpi
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: priceghost-backend
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-this-in-production}@postgres:5432/priceghost
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-use-strong-secret}
      PORT: 3001
      NODE_ENV: production
      
      # ========== REMOTE OLLAMA CONFIGURATION ==========
      # Point to your powerful server's Ollama instance
      # Replace 192.168.1.100 with your server's IP address
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.1.100:11434}
      
      # ========== MEMORY OPTIMIZATIONS ==========
      # Node.js memory limit for Raspberry Pi 4GB
      # Sets max heap size to ~1.5GB to leave room for OS and other services
      NODE_OPTIONS: --max-old-space-size=1536
      
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # RPi optimization: Limit memory usage
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - priceghost

  # Frontend (lightweight Nginx)
  frontend:
    image: priceghost-frontend:rpi-arm64
    build:
      context: ./frontend
      dockerfile: Dockerfile.rpi
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: priceghost-frontend
    ports:
      - "8089:80"
    depends_on:
      - backend
    restart: unless-stopped
    # RPi optimization: Minimal memory footprint
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - priceghost

volumes:
  postgres_data:

networks:
  priceghost:
    driver: bridge
